name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF2'
          {
            "name": "city-race",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2",
              "three": "0.128.0"
            }
          }
          EOF2
          cat > capacitor.config.json <<'EOF2'
          {
            "appId": "com.cityrace.game",
            "appName": "City Race",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartext": true }
          }
          EOF2
          npm install
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
      - name: Add Android and patch
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $M
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' $M
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          IM=$(command -v magick || command -v convert)
          SRC=""
          for f in icon.png icon.jpg icon.jpeg Icon.png Icon.jpg; do if [ -f "$f" ]; then SRC="$f"; break; fi; done
          if [ -z "$SRC" ]; then SRC=$(find . \( -path ./node_modules -o -path ./android \) -prune -o \( -iname 'icon*.png' -o -iname 'icon*.jpg' -o -iname 'icon*.jpeg' \) -print | head -1); fi
          if [ -z "$SRC" ]; then
            grep -o 'id="lcar"[^>]*' index.html | sed 's/.*base64,//; s/"$//' | base64 -d > /tmp/icon.jpg
            SRC=/tmp/icon.jpg
          fi
          echo "icon source: $SRC"
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            $IM "$SRC" -resize ${2}x${2} $R/mipmap-$1/ic_launcher.png || echo "icon resize failed"
            cp $R/mipmap-$1/ic_launcher.png $R/mipmap-$1/ic_launcher_round.png 2>/dev/null || true
            cp $R/mipmap-$1/ic_launcher.png $R/mipmap-$1/ic_launcher_foreground.png 2>/dev/null || true
          done
          D=android/app/src/main/java/com/cityrace/game
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "org.java-websocket:Java-WebSocket:1.5.6"/' android/app/build.gradle
          cat > $D/MainActivity.java <<'EOF2'
          package com.cityrace.game;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  try { getBridge().getWebView().addJavascriptInterface(new HostBridge(), "HostBridge"); } catch (Exception e) { }
              }

              @Override
              public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }
          }
          EOF2
          cat > $D/HostBridge.java <<'EOF2'
          package com.cityrace.game;

          import android.webkit.JavascriptInterface;
          import org.java_websocket.WebSocket;
          import org.java_websocket.handshake.ClientHandshake;
          import org.java_websocket.server.WebSocketServer;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.NetworkInterface;
          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.Map;

          public class HostBridge {
              private Srv srv;

              @JavascriptInterface
              public synchronized String start(int port) {
                  try {
                      if (srv != null) { try { srv.stop(300); } catch (Exception e) { } srv = null; }
                      srv = new Srv(port);
                      srv.setReuseAddr(true);
                      srv.start();
                      StringBuilder sb = new StringBuilder();
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          for (InetAddress a : Collections.list(ni.getInetAddresses())) {
                              if (a instanceof Inet4Address && !a.isLoopbackAddress()) {
                                  if (sb.length() > 0) sb.append(',');
                                  sb.append(a.getHostAddress());
                              }
                          }
                      }
                      return sb.length() > 0 ? sb.toString() : "127.0.0.1";
                  } catch (Exception e) {
                      return "ERR:" + e.getMessage();
                  }
              }

              @JavascriptInterface
              public synchronized void stop() {
                  try { if (srv != null) srv.stop(300); } catch (Exception e) { }
                  srv = null;
              }

              static class Srv extends WebSocketServer {
                  private final Map<WebSocket, JSONObject> info = new LinkedHashMap<>();
                  private int nextId = 1;
                  private int host = 0;

                  Srv(int port) { super(new InetSocketAddress(port)); }

                  @Override public void onStart() { }
                  @Override public void onError(WebSocket c, Exception e) { }

                  @Override public synchronized void onOpen(WebSocket c, ClientHandshake h) {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("id", nextId++);
                          o.put("name", "Player");
                          o.put("car", 0);
                          info.put(c, o);
                          if (host == 0) host = o.getInt("id");
                      } catch (Exception e) { }
                  }

                  @Override public synchronized void onClose(WebSocket c, int code, String reason, boolean remote) {
                      JSONObject o = info.remove(c);
                      if (o == null) return;
                      try {
                          int id = o.getInt("id");
                          if (host == id) {
                              host = 0;
                              for (JSONObject p : info.values()) { host = p.getInt("id"); break; }
                          }
                          JSONObject m = new JSONObject();
                          m.put("t", "left");
                          m.put("id", id);
                          sendAll(m.toString(), null);
                          lobby();
                      } catch (Exception e) { }
                  }

                  @Override public synchronized void onMessage(WebSocket c, String msg) {
                      try {
                          JSONObject m = new JSONObject(msg);
                          JSONObject me = info.get(c);
                          if (me == null) return;
                          String t = m.optString("t");
                          int id = me.getInt("id");
                          if (t.equals("hello")) {
                              String nm = m.optString("name", "Player");
                              if (nm.length() > 14) nm = nm.substring(0, 14);
                              me.put("name", nm);
                              me.put("car", m.optInt("car", 0));
                              lobby();
                          } else if (t.equals("s")) {
                              m.put("id", id);
                              sendAll(m.toString(), c);
                          } else if (t.equals("start") && id == host) {
                              JSONObject g = new JSONObject();
                              g.put("t", "go");
                              JSONArray order = new JSONArray();
                              for (JSONObject p : info.values()) order.put(p.getInt("id"));
                              g.put("order", order);
                              sendAll(g.toString(), null);
                          } else if (t.equals("fin")) {
                              JSONObject f = new JSONObject();
                              f.put("t", "fin");
                              f.put("id", id);
                              f.put("time", m.optDouble("time", 0));
                              sendAll(f.toString(), c);
                          }
                      } catch (Exception e) { }
                  }

                  private void sendAll(String s, WebSocket except) {
                      for (WebSocket w : info.keySet()) {
                          if (w != except && w.isOpen()) { try { w.send(s); } catch (Exception e) { } }
                      }
                  }

                  private void lobby() {
                      try {
                          JSONArray arr = new JSONArray();
                          for (JSONObject p : info.values()) arr.put(p);
                          for (Map.Entry<WebSocket, JSONObject> en : info.entrySet()) {
                              JSONObject m = new JSONObject();
                              m.put("t", "lobby");
                              m.put("you", en.getValue().getInt("id"));
                              m.put("host", host);
                              m.put("players", arr);
                              if (en.getKey().isOpen()) en.getKey().send(m.toString());
                          }
                      } catch (Exception e) { }
                  }
              }
          }
          EOF2
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: city-race-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
